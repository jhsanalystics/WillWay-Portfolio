<script>


/* =========================================================
   AUTHENTICATION
========================================================= */

const TOKEN_STORAGE_KEY = 'authToken';


function hasValidAuthToken() {

    const token =
        localStorage.getItem(
            TOKEN_STORAGE_KEY
        );


    if (!token) {

        return false;

    }


    try {

        const tokenParts =
            token.split('.');


        if (tokenParts.length !== 3) {

            throw new Error(
                'Malformed token'
            );

        }


        const payload =
            JSON.parse(
                atob(
                    tokenParts[1]
                        .replace(/-/g, '+')
                        .replace(/_/g, '/')
                )
            );


        const isValid =
            Number.isFinite(payload.exp) &&
            payload.exp >
            Math.floor(Date.now() / 1000);


        if (!isValid) {

            localStorage.removeItem(
                TOKEN_STORAGE_KEY
            );

        }


        return isValid;


    } catch (error) {

        console.error(
            "Authentication error:",
            error
        );


        localStorage.removeItem(
            TOKEN_STORAGE_KEY
        );


        return false;

    }

}



/* =========================================================
   REDIRECT IF NOT LOGGED IN
========================================================= */

if (!hasValidAuthToken()) {

    window.location.replace(
        'login.html'
    );

} else {


/* =========================================================
   THEME
========================================================= */

const THEME =
    '#D23450';

const THEME1 =
    '#F9FAFB';



/* =========================================================
   INDUSTRY CONFIG
========================================================= */

const IC = {

    'Finance': { bg: THEME1 },
    'HR': { bg: THEME1 },
    'Supply Chain': { bg: THEME1 },
    'Share Market': { bg: THEME1 },
    'Sales': { bg: THEME1 },
    'Operations': { bg: THEME1 },
    'Procurement': { bg: THEME1 },
    'Reconciliation': { bg: THEME1 },
    'Healthcare': { bg: THEME1 },
    'CRM': { bg: THEME1 },
    'Digital Marketing & SEO': { bg: THEME1 }

};



/* =========================================================
   GOOGLE SHEETS CONNECTION
========================================================= */

/*
    HOW TO GET THESE VALUES:

    1. Open your Google Sheet.
    2. Look at the URL bar. It looks like:

       https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit?gid=SHEET_GID#gid=SHEET_GID

    3. Copy the SPREADSHEET_ID and SHEET_GID into the two
       constants below.

    4. Make sure the sheet is shared as:
       Anyone with the link -> Viewer

    ---------------------------------------------------------

    WHY THIS URL FORMAT (gviz/tq):

    Plain /export?format=csv links sometimes fail on certain
    Google accounts, returning a login/interstitial HTML page
    instead of CSV (this is a known Google-side inconsistency,
    not a bug in this code). The /gviz/tq endpoint is Google's
    Visualization API and is generally more reliable for public,
    anonymous CSV access.

    If THIS ALSO FAILS with "Google returned an HTML page":

    -> Go to File -> Share -> Publish to web in your Google Sheet,
       choose your data tab, set format to CSV, click Publish,
       and paste the generated link (looks like
       https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?output=csv)
       directly into the PUBLISHED_CSV_URL constant below instead.
       That endpoint always works regardless of account quirks.
*/

const SPREADSHEET_ID = '1iDEStX3iMiwrxbmXO8-RHTLoJGn2Mw_fwiq3S7vwb5s';
const SHEET_GID = '549367320';

// Primary attempt: Google Visualization API (more reliable than /export)
const GVIZ_URL =
    `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;

// Fallback: paste your "Publish to web" CSV link here if GVIZ_URL fails.
// Leave as empty string '' if you don't have one yet.
const PUBLISHED_CSV_URL = '';

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let DATA = [];

let AF = 'All';



/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = '';

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];
        const nextChar = text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            nextChar === '"'
        ) {

            value += '"';
            i++;
            continue;

        }


        if (char === '"') {

            insideQuotes = !insideQuotes;
            continue;

        }


        if (
            char === ',' &&
            !insideQuotes
        ) {

            row.push(value);
            value = '';
            continue;

        }


        if (
            (char === '\n' || char === '\r') &&
            !insideQuotes
        ) {

            if (char === '\r' && nextChar === '\n') {
                i++;
            }

            row.push(value);
            rows.push(row);
            row = [];
            value = '';
            continue;

        }


        value += char;

    }


    if (value !== '' || row.length > 0) {
        row.push(value);
        rows.push(row);
    }


    return rows;

}



/* =========================================================
   FETCH HELPER — checks for HTML interstitial
========================================================= */

async function fetchCSV(url) {

    const response = await fetch(
        url,
        {
            method: 'GET',
            cache: 'no-cache'
        }
    );

    if (!response.ok) {
        throw new Error(
            `Request failed: ${response.status} ${response.statusText}`
        );
    }

    const csvData = await response.text();

    if (!csvData.trim()) {
        throw new Error("Google Sheet returned empty data.");
    }

    const trimmed = csvData.trim();

    if (
        trimmed.startsWith('<!DOCTYPE html') ||
        trimmed.startsWith('<html')
    ) {
        throw new Error("HTML_INTERSTITIAL");
    }

    return csvData;

}



/* =========================================================
   LOAD DATA FROM GOOGLE SHEET
========================================================= */

async function loadDataFromSheet() {


    const grid = document.getElementById('portfolio-grid');


    grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:100px 20px;color:#777;">
            <div style="font-size:18px;margin-bottom:10px;">Loading projects...</div>
            <div style="font-size:13px;color:#aaa;">Connecting to Google Sheets</div>
        </div>
    `;


    let csvData = null;
    let lastError = null;


    /*
        Try GVIZ endpoint first
    */

    try {

        csvData = await fetchCSV(GVIZ_URL);

    } catch (error) {

        lastError = error;
        console.warn("GVIZ endpoint failed, will try fallback if available:", error.message);

    }


    /*
        Fallback to published CSV URL if GVIZ failed
        and a published URL has been provided
    */

    if (!csvData && PUBLISHED_CSV_URL) {

        try {

            csvData = await fetchCSV(PUBLISHED_CSV_URL);

        } catch (error) {

            lastError = error;
            console.error("Published CSV fallback also failed:", error.message);

        }

    }


    /*
        Both methods failed
    */

    if (!csvData) {

        const isInterstitial =
            lastError && lastError.message === "HTML_INTERSTITIAL";

        const errorMessage = isInterstitial
            ? "Google returned an HTML page instead of CSV. This sheet needs to be published via File > Share > Publish to web, then paste that link into PUBLISHED_CSV_URL in the code."
            : (lastError ? lastError.message : "Unknown error loading sheet.");

        console.error("=================================");
        console.error("ERROR LOADING GOOGLE SHEET:");
        console.error(errorMessage);
        console.error("=================================");

        grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:80px 20px;color:#999;">
                <h3 style="color:#555;margin-bottom:15px;">Could not load projects</h3>
                <p style="margin-bottom:10px;">Unable to retrieve data from Google Sheets.</p>
                <p style="font-size:13px;color:#aaa;margin-bottom:20px;">
                    Please check your Google Sheet permissions and Sheet URL.
                </p>
                <div style="max-width:600px;margin:auto;padding:15px;background:#f8f8f8;border-radius:8px;font-size:12px;color:#777;word-break:break-word;">
                    <strong>Error:</strong> ${escapeHTML(errorMessage)}
                </div>
                <p style="margin-top:20px;font-size:13px;color:#aaa;">
                    Google Sheet should be accessible as:
                    <strong>Anyone with the link &rarr; Viewer</strong>
                </p>
            </div>
        `;

        return;

    }


    /*
        Parse CSV
    */

    try {

        const rows = parseCSV(csvData);

        if (rows.length < 2) {
            throw new Error("No project data found in Google Sheet.");
        }

        /* =================================================
           EXPECTED COLUMNS

           Column A = Title
           Column B = Industry
           Column C = Description
           Column D = Dashboard URL
           Column E = Image URL
        ================================================= */

        DATA = rows
            .slice(1)
            .map((cols) => {
                return {
                    title: (cols[0] || '').trim(),
                    industry: (cols[1] || '').trim(),
                    description: (cols[2] || '').trim(),
                    dashboardUrl: (cols[3] || '').trim(),
                    imageUrl: (cols[4] || '').trim()
                };
            })
            .filter(project => project.title !== '');

        if (DATA.length === 0) {
            throw new Error("Google Sheet contains no valid project rows.");
        }

        refresh();

    } catch (error) {

        console.error("=================================");
        console.error("ERROR PARSING GOOGLE SHEET DATA:");
        console.error(error);
        console.error("=================================");

        grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:80px 20px;color:#999;">
                <h3 style="color:#555;margin-bottom:15px;">Could not load projects</h3>
                <p style="margin-bottom:10px;">${escapeHTML(error.message)}</p>
            </div>
        `;

    }

}



/* =========================================================
   GET INDUSTRY COLOR
========================================================= */

function gc(industry) {

    for (const [key, value] of Object.entries(IC)) {

        if (
            industry &&
            industry.toLowerCase().includes(key.toLowerCase())
        ) {
            return value;
        }

    }

    return { bg: THEME1 };

}



/* =========================================================
   BUILD FILTER BUTTONS
========================================================= */

function buildFilters() {

    const bar = document.getElementById('filters-container');

    if (!bar) {
        return;
    }

    bar.innerHTML = `
        <span class="fl">Sector:</span>
        <button class="fb active" onclick="filter('All', this)">All</button>
    `;

    const industries = [
        ...new Set(
            DATA
                .map(project => project.industry)
                .filter(industry => industry)
        )
    ];

    industries.forEach(industry => {

        const button = document.createElement('button');
        button.className = 'fb';
        button.textContent = industry;
        button.onclick = function () {
            filter(industry, this);
        };
        bar.appendChild(button);

    });

}



/* =========================================================
   FILTER PROJECTS
========================================================= */

function filter(value, button) {

    AF = value;

    document.querySelectorAll('.fb').forEach(btn => {
        btn.classList.remove('active');
    });

    if (button) {
        button.classList.add('active');
    }

    const filteredData =
        value === 'All'
            ? DATA
            : DATA.filter(project => project.industry === value);

    render(filteredData);

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}



/* =========================================================
   RENDER PROJECTS
========================================================= */

function render(list) {

    const grid = document.getElementById('portfolio-grid');

    if (!list.length) {
        grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:100px;">
                No projects found.
            </div>
        `;
        return;
    }

    grid.innerHTML = list
        .map(project => {

            const color = gc(project.industry);
            const title = escapeHTML(project.title);
            const industry = escapeHTML(project.industry);
            const description = escapeHTML(project.description);
            const dashboardUrl = escapeHTML(project.dashboardUrl);
            const imageUrl = escapeHTML(project.imageUrl);

            return `
                <div class="portfolio-card" onclick="openDashboard('${dashboardUrl}')">
                    <div class="card-header">
                        <span class="industry-badge" style="background-color:${color.bg};">
                            ${industry}
                        </span>
                        <div class="image-container">
                            <img
                                src="${imageUrl}"
                                alt="${title}"
                                loading="lazy"
                                onerror="this.onerror=null; this.src='https://via.placeholder.com/400x200?text=Preview+Coming+Soon';"
                            >
                        </div>
                    </div>
                    <div class="portfolio-info">
                        <h3>${title}</h3>
                        <div class="desc-container" data-fulltext="${description}">
                            <p class="description">${description}</p>
                        </div>
                        <div class="open-btn" style="background:${THEME};">
                            View Dashboard &rarr;
                        </div>
                    </div>
                </div>
            `;

        })
        .join('');

}



/* =========================================================
   OPEN DASHBOARD
========================================================= */

function openDashboard(url) {

    if (!url) {
        console.error("Dashboard URL is missing.");
        return;
    }

    window.open(url, '_blank', 'noopener,noreferrer');

}



/* =========================================================
   REFRESH
========================================================= */

function refresh() {

    buildFilters();

    const filteredData =
        AF === 'All'
            ? DATA
            : DATA.filter(project => project.industry === AF);

    render(filteredData);

}



/* =========================================================
   START
========================================================= */

loadDataFromSheet();


}


</script>


</body>
