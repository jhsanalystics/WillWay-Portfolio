<script>


/* =========================================================
   AUTHENTICATION
========================================================= */

const TOKEN_STORAGE_KEY = 'authToken';


function hasValidAuthToken() {

    const token =
        localStorage.getItem(
            TOKEN_STORAGE_KEY
        );


    if (!token) {

        return false;

    }


    try {

        const tokenParts =
            token.split('.');


        if (tokenParts.length !== 3) {

            throw new Error(
                'Malformed token'
            );

        }


        const payload =
            JSON.parse(
                atob(
                    tokenParts[1]
                        .replace(/-/g, '+')
                        .replace(/_/g, '/')
                )
            );


        const isValid =
            Number.isFinite(payload.exp) &&
            payload.exp >
            Math.floor(Date.now() / 1000);


        if (!isValid) {

            localStorage.removeItem(
                TOKEN_STORAGE_KEY
            );

        }


        return isValid;


    } catch (error) {

        console.error(
            "Authentication error:",
            error
        );


        localStorage.removeItem(
            TOKEN_STORAGE_KEY
        );


        return false;

    }

}

if (!hasValidAuthToken()) {

/* =========================================================

const THEME1 =

/* =========================================================
   GOOGLE SHEETS CONNECTION
========================================================= */

/*
    IMPORTANT:

    Do NOT use the normal Google Sheets /edit URL.

    Correct format:

    /export?format=csv&gid=YOUR_GID
*/
// const SPREADSHEET_ID = '1ah5UmcQYI8FkM9QzX7xd-g6P_Bj2XtcNAItrHzMWdJY';
// const SHEET_GID = '32159893';

const sheetUrl =
    `https://docs.google.com/spreadsheets/d/1iDEStX3iMiwrxbmXO8-RHTLoJGn2Mw_fwiq3S7vwb5s/edit?gid=549367320#gid=549367320/pub?output=csv`;

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let DATA = [];

let AF = 'All';



/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = '';

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const nextChar =
            text[i + 1];


        /*
            Double quote inside quoted value
        */

        if (
            char === '"' &&
            insideQuotes &&
            nextChar === '"'
        ) {

            value += '"';

            i++;

            continue;

        }



        /*
            Start / end quotes
        */

        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }



        /*
            Comma
        */

        if (
            char === ',' &&
            !insideQuotes
        ) {

            row.push(value);

            value = '';

            continue;

        }



        /*
            New line
        */

        if (
            (char === '\n' ||
             char === '\r') &&
            !insideQuotes
        ) {

            if (
                char === '\r' &&
                nextChar === '\n'
            ) {

                i++;

            }


            row.push(value);

            rows.push(row);

            row = [];

            value = '';

            continue;

        }


        value += char;

    }



    /*
        Last row
    */

    if (
        value !== '' ||
        row.length > 0
    ) {

        row.push(value);

        rows.push(row);

    }


    return rows;

}



/* =========================================================
   LOAD DATA FROM GOOGLE SHEET
========================================================= */

async function loadDataFromSheet() {


    const grid =
        document.getElementById(
            'portfolio-grid'
        );


    /*
        Loading message
    */

    grid.innerHTML = `

        <div
            style="
                grid-column:1/-1;
                text-align:center;
                padding:100px 20px;
                color:#777;
            "
        >

            <div
                style="
                    font-size:18px;
                    margin-bottom:10px;
                "
            >
                Loading projects...
            </div>

            <div
                style="
                    font-size:13px;
                    color:#aaa;
                "
            >
                Connecting to Google Sheets
            </div>

        </div>

    `;



    try {




        /*
            Fetch Google Sheet CSV
        */

        const response =
            await fetch(
                sheetUrl,
                {
                    method: 'GET',
                    cache: 'no-cache'
                }
            );

        /*
            Check HTTP response
        */

        if (!response.ok) {

            throw new Error(
                `Google Sheet request failed: ${response.status} ${response.statusText}`
            );

        }



        /*
            Read CSV
        */

        const csvData =
            await response.text();


        /*
            Empty check
        */

        if (!csvData.trim()) {

            throw new Error(
                "Google Sheet returned empty data."
            );

        }



        /*
            Check if Google returned
            an HTML login/permission page
        */

        if (
            csvData
                .trim()
                .startsWith('<!DOCTYPE html')
            ||
            csvData
                .trim()
                .startsWith('<html')
        ) {

            throw new Error(
                "Google returned an HTML page instead of CSV. Check Google Sheet permissions."
            );

        }



        /*
            Parse CSV
        */

        const rows =
            parseCSV(csvData);



 
        /*
            Need header + data
        */

        if (rows.length < 2) {

            throw new Error(
                "No project data found in Google Sheet."
            );

        }



        /* =================================================
           EXPECTED COLUMNS

           Column A = Title
           Column B = Industry
           Column C = Description
           Column D = Dashboard URL
           Column E = Image URL
        ================================================= */



        /*
            Convert rows to objects
        */

        DATA =
            rows
                .slice(1)
                .map(
                    (cols) => {

                        return {

                            title:
                                (cols[0] || '')
                                    .trim(),

                            industry:
                                (cols[1] || '')
                                    .trim(),

                            description:
                                (cols[2] || '')
                                    .trim(),

                            dashboardUrl:
                                (cols[3] || '')
                                    .trim(),

                            imageUrl:
                                (cols[4] || '')
                                    .trim()

                        };

                    }
                )
                .filter(
                    project =>
                        project.title !== ''
                );



        /*
            Check data
        */

        if (DATA.length === 0) {

            throw new Error(
                "Google Sheet contains no valid project rows."
            );

        }



        /*
            Refresh dashboard
        */

        refresh();


    } catch (error) {


        console.error(
            "================================="
        );

        console.error(
            "ERROR LOADING GOOGLE SHEET:"
        );

        console.error(
            error
        );

        console.error(
            "================================="
        );



        /*
            Display error
        */

        grid.innerHTML = `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:80px 20px;
                    color:#999;
                "
            >

                <h3
                    style="
                        color:#555;
                        margin-bottom:15px;
                    "
                >
                    Could not load projects
                </h3>


                <p
                    style="
                        margin-bottom:10px;
                    "
                >
                    Unable to retrieve data from Google Sheets.
                </p>


                <p
                    style="
                        font-size:13px;
                        color:#aaa;
                        margin-bottom:20px;
                    "
                >
                    Please check your Google Sheet
                    permissions and Sheet URL.
                </p>


                <div
                    style="
                        max-width:600px;
                        margin:auto;
                        padding:15px;
                        background:#f8f8f8;
                        border-radius:8px;
                        font-size:12px;
                        color:#777;
                        word-break:break-word;
                    "
                >

                    <strong>
                        Error:
                    </strong>

                    ${escapeHTML(error.message)}

                </div>


                <p
                    style="
                        margin-top:20px;
                        font-size:13px;
                        color:#aaa;
                    "
                >

                    Google Sheet should be accessible as:

                    <strong>
                        Anyone with the link → Viewer
                    </strong>

                </p>

            </div>

        `;

    }

}



/* =========================================================
   GET INDUSTRY COLOR
========================================================= */

function gc(industry) {


    for (
        const [key, value]
        of Object.entries(IC)
    ) {


        if (
            industry &&
            industry
                .toLowerCase()
                .includes(
                    key.toLowerCase()
                )
        ) {

            return value;

        }

    }


    return {

        bg: THEME1

    };

}



/* =========================================================
   BUILD FILTER BUTTONS
========================================================= */

function buildFilters() {


    const bar =
        document.getElementById(
            'filters-container'
        );


    if (!bar) {

        return;

    }



    /*
        Default All button
    */

    bar.innerHTML = `

        <span class="fl">
            Sector:
        </span>

        <button
            class="fb active"
            onclick="filter('All', this)"
        >
            All
        </button>

    `;



    /*
        Get unique industries
    */

    const industries =
        [
            ...new Set(
                DATA
                    .map(
                        project =>
                            project.industry
                    )
                    .filter(
                        industry =>
                            industry
                    )
            )
        ];



    /*
        Create buttons
    */

    industries.forEach(
        industry => {


            const button =
                document.createElement(
                    'button'
                );


            button.className =
                'fb';


            button.textContent =
                industry;


            button.onclick =
                function () {

                    filter(
                        industry,
                        this
                    );

                };


            bar.appendChild(
                button
            );

        }
    );

}



/* =========================================================
   FILTER PROJECTS
========================================================= */

function filter(
    value,
    button
) {


    AF = value;



    /*
        Remove active
    */

    document
        .querySelectorAll('.fb')
        .forEach(
            btn => {

                btn.classList.remove(
                    'active'
                );

            }
        );



    /*
        Add active
    */

    if (button) {

        button.classList.add(
            'active'
        );

    }



    /*
        Filter data
    */

    const filteredData =
        value === 'All'
            ? DATA
            : DATA.filter(
                project =>
                    project.industry ===
                    value
            );



    /*
        Render
    */

    render(
        filteredData
    );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {


    return String(
        value || ''
    )
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}



/* =========================================================
   RENDER PROJECTS
========================================================= */

function render(list) {


    const grid =
        document.getElementById(
            'portfolio-grid'
        );



    /*
        No projects
    */

    if (!list.length) {


        grid.innerHTML = `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:100px;
                "
            >

                No projects found.

            </div>

        `;


        return;

    }



    /*
        Create cards
    */

    grid.innerHTML =
        list
            .map(
                project => {


                    const color =
                        gc(
                            project.industry
                        );



                    const title =
                        escapeHTML(
                            project.title
                        );


                    const industry =
                        escapeHTML(
                            project.industry
                        );


                    const description =
                        escapeHTML(
                            project.description
                        );


                    const dashboardUrl =
                        escapeHTML(
                            project.dashboardUrl
                        );


                    const imageUrl =
                        escapeHTML(
                            project.imageUrl
                        );



                    return `

                        <div
                            class="portfolio-card"
                            onclick="openDashboard('${dashboardUrl}')"
                        >

                            <div
                                class="card-header"
                            >


                                <span
                                    class="industry-badge"
                                    style="
                                        background-color:${color.bg};
                                    "
                                >

                                    ${industry}

                                </span>



                                <div
                                    class="image-container"
                                >

                                    <img
                                        src="${imageUrl}"
                                        alt="${title}"
                                        loading="lazy"
                                        onerror="
                                            this.onerror=null;
                                            this.src='https://via.placeholder.com/400x200?text=Preview+Coming+Soon';
                                        "
                                    >

                                </div>


                            </div>



                            <div
                                class="portfolio-info"
                            >

                                <h3>
                                    ${title}
                                </h3>



                                <div
                                    class="desc-container"
                                    data-fulltext="${description}"
                                >

                                    <p
                                        class="description"
                                    >
                                        ${description}
                                    </p>

                                </div>



                                <div
                                    class="open-btn"
                                    style="
                                        background:${THEME};
                                    "
                                >

                                    View Dashboard →

                                </div>


                            </div>


                        </div>

                    `;

                }
            )
            .join('');

}



/* =========================================================
   OPEN DASHBOARD
========================================================= */

function openDashboard(url) {


    if (!url) {

        console.error(
            "Dashboard URL is missing."
        );

        return;

    }


    window.open(
        url,
        '_blank',
        'noopener,noreferrer'
    );

}



/* =========================================================
   REFRESH
========================================================= */

function refresh() {


    buildFilters();


    const filteredData =
        AF === 'All'
            ? DATA
            : DATA.filter(
                project =>
                    project.industry ===
                    AF
            );


    render(
        filteredData
    );

}



/* =========================================================
   START
========================================================= */

loadDataFromSheet();


}


</script>
